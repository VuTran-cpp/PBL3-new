
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:16px 0}
.group-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px 2px}
.groups{display:flex;flex-direction:column;gap:20px}
.group{border-radius:var(--border-radius-lg);border:1px solid var(--color-border-tertiary);overflow:hidden}
.group-header{padding:8px 14px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--color-border-tertiary)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tables-row{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--color-background-secondary)}
.tbl-btn{border:1px solid var(--color-border-secondary);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);transition:all .15s;white-space:nowrap}
.tbl-btn:hover{color:var(--color-text-primary);border-color:var(--color-border-primary)}
.tbl-btn.active{color:var(--color-text-primary);border-width:1.5px}

.detail-panel{margin-top:16px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;display:none}
.detail-panel.show{display:block}
.detail-header{padding:12px 16px;border-bottom:1px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px}
.detail-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.detail-desc{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}

.cols-table{width:100%;border-collapse:collapse}
.cols-table thead tr{background:var(--color-background-tertiary)}
.cols-table th{font-size:11px;font-weight:500;color:var(--color-text-tertiary);text-align:left;padding:6px 14px;border-bottom:1px solid var(--color-border-tertiary);letter-spacing:.04em}
.cols-table td{font-size:12px;padding:7px 14px;border-bottom:1px solid var(--color-border-tertiary);color:var(--color-text-secondary)}
.cols-table tr:last-child td{border-bottom:none}
.cols-table tr:hover td{background:var(--color-background-secondary)}
.col-name{font-family:var(--font-mono);font-size:11.5px;color:var(--color-text-primary);font-weight:500}
.col-type{font-family:var(--font-mono);font-size:11px;color:var(--color-text-info)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-right:3px;font-weight:500}
.tag-pk{background:var(--color-background-warning);color:var(--color-text-warning)}
.tag-fk{background:var(--color-background-info);color:var(--color-text-info)}
.tag-uq{background:var(--color-background-success);color:var(--color-text-success)}
.tag-nn{background:var(--color-background-secondary);color:var(--color-text-tertiary)}

.rels{padding:12px 16px;border-top:1px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.rels-title{font-size:11px;font-weight:500;color:var(--color-text-tertiary);margin-bottom:6px;letter-spacing:.04em}
.rel-item{font-size:12px;color:var(--color-text-secondary);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.rel-arrow{color:var(--color-text-tertiary);font-size:10px}
.rel-tbl{font-family:var(--font-mono);font-size:11px;color:var(--color-text-primary);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
</style>

<div class="wrap">
<div id="groups" class="groups"></div>
<div id="panel" class="detail-panel">
  <div class="detail-header">
    <div id="ph-dot" class="dot"></div>

    <div id="ph-rels-list"></div>
  </div>
</div>
</div>

const TAG_CLASS = {PK:'tag-pk',FK:'tag-fk',UQ:'tag-uq',NN:'tag-nn'};
let activeBtn = null;

function renderGroups(){
  const container = document.getElementById('groups');
  GROUPS.forEach(g=>{
    const div = document.createElement('div');
    div.className='group';
    div.innerHTML=`<div class="group-header"><div class="dot" style="background:${g.color}"></div><span>${g.name}</span><span style="margin-left:auto;font-size:11px;color:var(--color-text-tertiary)">${g.tables.length} bảng</span></div><div class="tables-row">${g.tables.map(t=>`<button class="tbl-btn" data-tbl="${t}" onclick="showTable('${t}',this)">${t}</button>`).join('')}</div>`;
    container.appendChild(div);
  });
}

function showTable(name, btn){
  if(activeBtn){ activeBtn.classList.remove('active'); activeBtn.style.borderColor=''; activeBtn.style.color=''; }
  const g = GROUPS.find(g=>g.tables.includes(name));
  btn.classList.add('active');
  btn.style.borderColor = g.color;
  btn.style.color = g.color;
  activeBtn = btn;

  const data = TABLES[name];
  document.getElementById('ph-dot').style.background = g.color;
  document.getElementById('ph-title').textContent = name;
  document.getElementById('ph-desc').textContent = data.desc;
  const badge = document.getElementById('ph-badge');
  badge.textContent = data.cols.length + ' cột';
  badge.style.background = g.color + '20';
  badge.style.color = g.color;

  const tbody = document.getElementById('ph-cols');
  tbody.innerHTML = data.cols.map(c=>`<tr><td class="col-name">${c.n}</td><td class="col-type">${c.t}</td><td>${c.tags.map(t=>`<span class="tag ${TAG_CLASS[t]}">${t}</span>`).join('')}</td><td style="color:var(--color-text-tertiary);font-size:11px">${c.note}</td></tr>`).join('');

  const relsDiv = document.getElementById('ph-rels');
  const relsList = document.getElementById('ph-rels-list');
  if(data.rels && data.rels.length>0){
    relsList.innerHTML = data.rels.map(r=>{
      const tbl = r.split('→')[1]?.trim().split('.')[0];
      return `<div class="rel-item"><span class="rel-arrow">↗</span><span>${r.split('→')[0].trim()}</span><span class="rel-arrow">→</span><span class="rel-tbl" onclick="const b=document.querySelector('[data-tbl=${tbl}]');if(b)showTable('${tbl}',b)">${r.split('→')[1]?.trim()}</span></div>`;
    }).join('');
    relsDiv.style.display='block';
  } else {
    relsDiv.style.display='none';
  }

  const panel = document.getElementById('panel');
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

renderGroups();
</script>
